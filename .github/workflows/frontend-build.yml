name: Frontend build

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tailwind.config.js"
      - "vite.config.js"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tailwind.config.js"
      - "vite.config.js"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
